<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
  <title>国内 L3 合规化进程时间轴</title>
  <desc>从 2025 年 12 月首批 L3 产品准入，到 2026 年 7 月六城试点、2026 年 8 月强制国标与国家立法，再到 2027 年 7 月强制国标实施。</desc>
  <rect width="900" height="300" fill="#FFFFFF"/>
  <text x="50" y="46" font-size="18" font-weight="500" fill="#2C2C2A">国内 L3 合规化进程</text>
  <text x="50" y="70" font-size="13" fill="#5F5E5A">产品准入 → 强制国标 → 国家立法，三线收口</text>

  <line x1="80" y1="182" x2="820" y2="182" stroke="#B4B2A9" stroke-width="2"/>

  <g text-anchor="middle">
    <text x="150" y="160" font-size="15" font-weight="500" fill="#0C447C">2025.12</text>
    <circle cx="150" cy="182" r="9" fill="#185FA5"/>
    <text x="150" y="212" font-size="13" font-weight="500" fill="#2C2C2A">首批 L3 产品准入</text>
    <text x="150" y="233" font-size="12" fill="#5F5E5A">深蓝 SL03、极狐 αS6</text>
    <text x="150" y="252" font-size="12" fill="#5F5E5A">重庆、北京试点</text>

    <text x="350" y="160" font-size="15" font-weight="500" fill="#0C447C">2026.07</text>
    <circle cx="350" cy="182" r="9" fill="#185FA5"/>
    <text x="350" y="212" font-size="13" font-weight="500" fill="#2C2C2A">试点扩至六城</text>
    <text x="350" y="233" font-size="12" fill="#5F5E5A">京 沪 广 深 渝 汉</text>

    <text x="550" y="160" font-size="15" font-weight="500" fill="#0C447C">2026.08</text>
    <circle cx="550" cy="182" r="9" fill="#185FA5"/>
    <text x="550" y="212" font-size="13" font-weight="500" fill="#2C2C2A">强制国标 + 国家立法</text>
    <text x="550" y="233" font-size="12" fill="#5F5E5A">GB 44721—2026 获批</text>
    <text x="550" y="252" font-size="12" fill="#5F5E5A">道交法草案首设专章</text>

    <text x="750" y="160" font-size="15" font-weight="500" fill="#0F6E56">2027.07</text>
    <circle cx="750" cy="182" r="9" fill="#0F6E56"/>
    <text x="750" y="212" font-size="13" font-weight="500" fill="#2C2C2A">强制国标正式实施</text>
    <text x="750" y="233" font-size="12" fill="#5F5E5A">L3 / L4 合规底线落地</text>
  </g>
</svg>
