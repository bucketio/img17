<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">诊断报告输出结构</title>
  <desc id="desc">An infographic showing the major sections of the audit report output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="34" fill="url(#bg)"/>
  <rect x="48" y="42" width="1104" height="476" rx="28" fill="white" opacity="0.84" stroke="#dbeafe"/>
  <text x="94" y="106" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="38" font-weight="800" fill="#0f172a">诊断报告长什么样</text>
  <text x="96" y="145" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#475569">把问题判断、修改顺序和改写骨架放在同一份 Markdown 里</text>

  <g filter="url(#shadow)">
    <rect x="96" y="198" width="324" height="276" rx="20" fill="#0f172a"/>
    <rect x="122" y="226" width="150" height="16" rx="8" fill="#99f6e4"/>
    <rect x="122" y="264" width="248" height="10" rx="5" fill="#64748b"/>
    <rect x="122" y="290" width="210" height="10" rx="5" fill="#64748b"/>
    <rect x="122" y="330" width="248" height="46" rx="12" fill="#1e293b" stroke="#334155"/>
    <path d="M146 353 H174 L188 333 L211 372 L229 350 H354" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="122" y="404" width="248" height="10" rx="5" fill="#64748b"/>
    <rect x="122" y="430" width="172" height="10" rx="5" fill="#64748b"/>
  </g>

  <g>
    <rect x="482" y="204" width="260" height="70" rx="16" fill="#ecfeff" stroke="#99f6e4"/>
    <text x="512" y="247" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#115e59">总体判断</text>
    <rect x="482" y="300" width="260" height="70" rx="16" fill="#fef3c7" stroke="#fde68a"/>
    <text x="512" y="343" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#92400e">一页逻辑图</text>
    <rect x="482" y="396" width="260" height="70" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="512" y="439" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#6d28d9">优先修改清单</text>
  </g>
  <g>
    <rect x="800" y="204" width="300" height="70" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="830" y="247" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#1d4ed8">分章节诊断</text>
    <rect x="800" y="300" width="300" height="70" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="830" y="343" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#c2410c">一致性矩阵</text>
    <rect x="800" y="396" width="300" height="70" rx="16" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="830" y="439" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#be185d">改写骨架</text>
  </g>

  <path d="M420 336 H464" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <path d="M744 336 H788" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
</svg>
