<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Ansible 管理 Windows 的连接方式</title>
  <desc id="desc">Linux 控制端通过 WinRM 或 PSRP 管理 Windows 被控端。</desc>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="48" y="65" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#182033">Windows 可以被管理，但不常做控制端</text>
  <rect x="80" y="150" width="260" height="130" rx="22" fill="#202938"/>
  <text x="118" y="204" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Ansible 控制机</text>
  <text x="133" y="244" font-family="Arial, sans-serif" font-size="20" fill="#cbd5e1">Linux / macOS</text>
  <path d="M360 215 H510" stroke="#607089" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="392" y="188" font-family="Arial, sans-serif" font-size="20" fill="#5f6b80">WinRM / PSRP</text>
  <rect x="540" y="150" width="280" height="130" rx="22" fill="#edf5ff" stroke="#c9d7ef" stroke-width="3"/>
  <text x="595" y="204" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2f6bd9">Windows 主机</text>
  <text x="600" y="244" font-family="Arial, sans-serif" font-size="20" fill="#334155">Server / Desktop</text>
  <text x="160" y="365" font-family="Arial, sans-serif" font-size="20" fill="#5f6b80">常见做法：准备一台控制机，通过远程管理通道批量操作 Windows</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#607089"/>
    </marker>
  </defs>
</svg>
