<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1440" width="750" height="1440" role="img" aria-labelledby="ms-title ms-desc">
<title id="ms-title">行动提出者，与出网审核者分开</title>
<desc id="ms-desc">依据 Meta 官方披露重绘的教学过程示意，以发送行程确认邮件为例。Muse 与独立 Sentinel 运行在同一台专属虚拟机内，并在系统级隔离。Muse 先起草邮件并提出请求，Sentinel 核对权限和出网请求；本例发送邮件属于敏感操作，询问用户并收到确认后才批准出网，用户可查看活动记录。普通请求可由 Sentinel 审核放行，仅在需要时询问用户。所有出网操作都需要 Sentinel 批准；这不表示 Sentinel 永不出错，也不是实际内部 API 路径或性能测试。</desc>
<defs>
<marker id="ms-arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#C9D4D8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ms-arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#138A84" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ms-arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#F28C45" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
